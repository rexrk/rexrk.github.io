<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raman – Resume</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <div class="header-col">
        <header>
            <div class="nav-buttons">
                <button onclick="location.href='portfolio.html'">Portfolio</button>
                <button class="active">My Resume</button>
                <button onclick="location.href='contact.html'">Connect</button>
            </div>
        </header>
    </div>

    <div class="nav-separator"></div>

    <!-- CONTEXT -->
    <div class="header-context">
        <header>
            <h1>$ gcloud storage cp gs://raman-resume/latest.pdf ./resume.pdf</h1>
            <h2>→ auth: service-account active</h2>
            <h2>→ transfer: 1 file OK</h2>
        </header>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- OPEN -->
        <section class="section">
            <div class="section-cmd">$ open ./resume.pdf</div>

            <div class="terminal-actions">
                <a href="https://drive.google.com/file/d/1ZhhmVIX8DFzRiXO8gbzjlJq2KSaBMHnz/preview" target="_blank"
                    class="terminal-btn">
                    ▶ Preview Resume
                </a>

                <a href="https://drive.google.com/uc?export=download&id=1ZhhmVIX8DFzRiXO8gbzjlJq2KSaBMHnz"
                    class="terminal-btn">
                    ⬇ Download Resume
                </a>
            </div>
        </section>

        <!-- INLINE RENDER -->
        <section class="section">
            <div class="section-cmd">$ render ./resume.pdf --inline</div>

            <div class="resume-frame">
                <iframe src="https://drive.google.com/file/d/1ZhhmVIX8DFzRiXO8gbzjlJq2KSaBMHnz/preview"
                    allow="autoplay">
                </iframe>
            </div>
        </section>

    </main>

</body>

</html>
